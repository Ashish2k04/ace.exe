info:
  name: Reset-Password
  type: http
  seq: 6

http:
  method: PATCH
  url: http://localhost:3000/api/auth/resetPassword
  body:
    type: json
    data: |-
      {
        "oldPassword": "{{password_2}}",
        "newPassword": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
