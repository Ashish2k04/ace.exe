info:
  name: Update-Email
  type: http
  seq: 6

http:
  method: PATCH
  url: http://localhost:3000/api/auth/updateEmail
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
