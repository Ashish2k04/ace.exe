info:
  name: chatWithEcho
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/echo/chat
  body:
    type: json
    data: |-
      {
        "question": "What skills ashish knows?"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
