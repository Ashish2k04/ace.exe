info:
  name: createProfile
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/user/createProfile
  body:
    type: json
    data: |-
      {
        "name": "{{name}}",
        "profileImage": "{{profileImage}}",
        "about": "{{about}}",
        "resume": "{{resume}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
