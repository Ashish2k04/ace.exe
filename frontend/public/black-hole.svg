<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Soft glow -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>
  <!-- Accretion disk (back half) -->
  <ellipse cx="100" cy="100" rx="85" ry="22" fill="none" stroke="#ffb347" stroke-width="6" stroke-opacity="0.6" transform="rotate(-15 100 100)"/>
  <!-- Event horizon -->
  <circle cx="100" cy="100" r="42" fill="#000"/>
  <!-- Photon ring -->
  <circle cx="100" cy="100" r="44" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Accretion disk (front half) -->
  <path d="M 15 112 A 85 22 -15 0 0 185 88" fill="none" stroke="#ffb347" stroke-width="6" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
